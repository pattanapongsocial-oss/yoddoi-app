*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; color:var(--ink); background:var(--bg);
  font-family:'Anuphan','Noto Sans Thai',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
#sky{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%)}
#sky::before{content:"";position:absolute;left:0;right:0;bottom:0;height:min(82vh,780px);
  background-image:var(--bgimg);background-size:cover;background-position:center center;background-repeat:no-repeat;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 100%);
          mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 100%)}
#sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:min(82vh,780px);
  background:linear-gradient(180deg,transparent 0%,
    color-mix(in srgb,var(--bg) 42%,transparent) 48%,
    color-mix(in srgb,var(--bg) 76%,transparent) 100%)}
h1,h2,h3{font-family:'Bai Jamjuree','Anuphan',system-ui,sans-serif;font-weight:700;margin:0;letter-spacing:-.015em;text-wrap:balance}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.03em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)} .fnt{color:var(--faint)}
.sm{font-size:12.5px} .xs{font-size:11.5px}

/* ---------- sidebar / dock ---------- */
#rail{position:fixed;z-index:40;background:linear-gradient(170deg,var(--deep),var(--deep2));color:var(--onDeep)}
.rbrand{display:flex;align-items:center;gap:11px;padding:4px 8px}
.rbrand .mk{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.10);display:grid;place-items:center;flex:none}
.rbrand h1{font-size:15px;line-height:1.15;letter-spacing:.04em}
.rbrand .sub{font-size:11px;color:var(--onDeepFaint)}
#rail nav{display:flex;flex-direction:column;gap:3px}
#rail nav button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:var(--onDeepFaint);font-size:14px;font-weight:500;width:100%;text-align:left}
#rail nav button .ic{width:17px;height:17px;flex:none;opacity:.85}
#rail nav button[aria-current="true"]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
#rail nav button[aria-current="true"] .ic{opacity:1}
.railfoot{margin-top:auto;background:rgba(255,255,255,.07);border-radius:14px;padding:11px 13px;font-size:11.5px;color:var(--onDeepFaint);display:flex;gap:9px;align-items:center}
.railfoot b{display:block;color:var(--onDeep);font-size:12.5px;font-weight:600}

@media(min-width:920px){
  #rail{top:0;left:0;bottom:0;width:236px;padding:22px 14px;display:flex;flex-direction:column;gap:22px}
  #shell{margin-left:236px}
}
@media(max-width:919px){
  #rail{left:10px;right:10px;bottom:10px;border-radius:20px;padding:7px;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
  #rail .rbrand{display:none}
  #rail nav{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
  #rail nav button{flex-direction:column;gap:2px;padding:8px 4px;font-size:11px;justify-content:center}
  #rail nav button .ic{width:18px;height:18px}
}
@media(max-width:919px){.railfoot{display:none}}

/* ---------- shell ---------- */
main{max-width:1120px;margin:0 auto;padding:20px 16px 108px;display:flex;flex-direction:column;gap:14px}
@media(min-width:920px){main{padding:26px 28px 40px}}
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.phead .eyebrow{font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.phead h2{font-size:24px;margin-top:1px}
.phead .act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:12px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--card);transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--sand);border-color:transparent;color:var(--sandInk)}
.btn.deep{background:var(--deep);border-color:transparent;color:var(--onDeep)}
.btn.ghost{background:color-mix(in srgb,var(--card) 72%,transparent);border-color:var(--line);color:var(--muted)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.dgr{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,transparent);background:transparent}
.btn:disabled{opacity:.5;cursor:default}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card .hd{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 0;flex-wrap:wrap}
.card .hd .eyebrow{font-size:11px;color:var(--faint);letter-spacing:.05em}
.card .hd h3{font-size:16px;margin-top:1px}
.card .hd .act{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pad{padding:16px 18px}
.grid{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:920px){.g23{grid-template-columns:1.45fr 1fr}}

/* hero */
.hero{border-radius:var(--r);padding:20px;color:#EFF6F4;position:relative;overflow:hidden;
  background-color:var(--deep2);background-image:var(--bgimg);background-size:cover;background-position:center 42%;
  box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg, rgba(6,24,29,.90) 0%, rgba(6,24,29,.72) 42%, rgba(6,24,29,.42) 100%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;
  background:linear-gradient(to top, rgba(4,16,20,.62), transparent)}
.hero>*{position:relative;z-index:1}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.18);font-size:11.5px;font-weight:600;backdrop-filter:blur(3px)}
.hero .big{font-size:34px;margin-top:6px;display:block;line-height:1.1}
@media(min-width:760px){.hero .big{font-size:40px}}
.hero .cap{font-size:12.5px;color:rgba(233,244,241,.80);margin-top:12px}
.hero .foot{display:flex;gap:22px;align-items:flex-end;margin-top:16px;flex-wrap:wrap}
.hero .foot .k{font-size:11.5px;color:rgba(233,244,241,.78)}
.hero .foot .v{font-size:16px}
.hero .foot .btn{margin-left:auto}

/* stat */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);min-width:0}
.stat .top{display:flex;align-items:center;gap:9px}
.stat .bubble{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--card2);flex:none}
.stat .lab{font-size:12px;color:var(--muted);font-weight:600}
.stat .val{font-size:24px;display:block;margin-top:9px;overflow-wrap:anywhere}
.stat .sub{font-size:11.5px;color:var(--faint);margin-top:2px}

/* net worth */
.nw .row{display:flex;align-items:baseline;gap:10px}
.nwbar{height:7px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:12px}
.nwbar>i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* donut */
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{flex:none}
.dlegend{flex:1;min-width:170px;display:flex;flex-direction:column}
.dlegend .l{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.dlegend .l:first-child{border-top:none}
.dlegend .sw{width:9px;height:9px;border-radius:3px;flex:none}
.dlegend .nm{flex:1 1 auto;min-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlegend .pc{color:var(--faint);font-size:12px}
.dlegend .vv{margin-left:auto;white-space:nowrap}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar .lin{display:flex;align-items:baseline;gap:8px;font-size:13.5px;margin-bottom:6px}

.hold .hg .k{font-size:11px;color:var(--faint);font-weight:600;display:block}

.scrim{position:fixed;inset:0;background:rgba(6,20,24,.5);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-end;justify-content:center}

ol.steps{margin:0;padding-left:20px;font-size:13.5px;color:var(--muted)}

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}

/* ---------- derived ---------- */
function txOf(mk){return S.tx.filter(function(t){return mkey(t.date)===mk})}

function plan(){

function port(){
  var val=0,cost=0;

    var v=(+h.qty||0)*(+h.price||0),c=(+h.qty||0)*(+h.cost||0);

  var a=startMk().split('-'),b=mkey(today()).split('-');
  var n=(+b[0]-+a[0])*12+(+b[1]-+a[1])+1;
  return Math.max(0,n);

function pvdContrib(){return (+S.profile.pvdM||0)*monthsSinceStart()}

function pvdValue(){
  var p=S.profile.pvd;
  if((+p.units||0)>0&&(+p.nav||0)>0)return (+p.units)*(+p.nav);

  var v=(+S.profile.bal.partner||0);
  partnerHoldings().forEach(function(h){v+=thb((+h.qty||0)*(+h.price||0),h.cur)});
  return v;

function wealth(){
  var b=S.profile.bal,p=port(),pv=pvdValue();
  var assets=(+b.cash||0)+(+b.emergency||0)+(+b.travel||0)+(+b.partner||0)+p.val+pv;
  return {assets:assets,debt:(+b.debt||0),net:assets-(+b.debt||0),port:p,pvd:pv};

var HOSTED=!(window.claude&&window.claude.use);
function yahooSym(h){
  var s=(h.symbol||'').trim().toUpperCase();
  if(h.cur==='THB'&&s.indexOf('.')<0)s+='.BK';
  return s;
}
function getJSON(u){
  return fetch(u,{cache:'no-store',mode:'cors'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
}
function chartURLs(sym){
  var path='/v8/finance/chart/'+encodeURIComponent(sym)+'?interval=1d&range=5d';
  return ['https://query1.finance.yahoo.com'+path,
          'https://query2.finance.yahoo.com'+path,
          'https://api.allorigins.win/raw?url='+encodeURIComponent('https://query1.finance.yahoo.com'+path)];
}
function readChart(j,sym){
  var m=j&&j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta;
  var p=m&&(m.regularMarketPrice||m.previousClose||m.chartPreviousClose);
  if(!(p>0))throw new Error('ไม่พบราคาของ '+sym);
  return +p;
}
function tryChain(urls,parse){
  var i=0,lastErr=null;
  function step(){
    if(i>=urls.length)return Promise.reject(lastErr||new Error('ดึงข้อมูลไม่ได้'));
    var u=urls[i++];
    return getJSON(u).then(parse,function(e){lastErr=e;return step()});
  }
  return step();
}
function quoteOf(sym){
  return tryChain(chartURLs(sym),function(j){return readChart(j,sym)});
}
function fetchRate(){
  return quoteOf('THB=X').catch(function(){
    return tryChain(['https://open.er-api.com/v6/latest/USD',
                     'https://api.allorigins.win/raw?url='+encodeURIComponent('https://open.er-api.com/v6/latest/USD')],
      function(j){var r=j&&j.rates&&j.rates.THB;if(!(r>0))throw new Error('ไม่พบอัตราแลกเปลี่ยน');return +r});
  });
}
function autoPrices(){
  if(typeof fetch!=='function')return Promise.resolve([{sym:'—',ok:false,e:'เบราว์เซอร์ไม่รองรับ'}]);
  var jobs=S.holdings.map(function(h){
    return quoteOf(yahooSym(h)).then(
      function(p){h.price=Math.round(p*10000)/10000;h.updated=today();return {sym:h.symbol,ok:true,p:p,cur:h.cur}},
      function(e){return {sym:h.symbol,ok:false,e:(e&&e.message)||'ดึงราคาไม่ได้'}});
  });
  jobs.push(fetchRate().then(
    function(r){S.settings.usdthb=Math.round(r*100)/100;return {sym:'USD/THB',ok:true,p:r,cur:'RATE'}},
    function(e){return {sym:'USD/THB',ok:false,e:(e&&e.message)||'ดึงอัตราไม่ได้'}}));
  return Promise.all(jobs).then(function(res){S.settings.lastAuto=today();return res});
}

/* ---------- ซิงก์ข้ามเครื่องผ่าน Google Drive (Apps Script) ---------- */
var SKEY='mymoney-sync';
var sync={url:'',at:0,state:'off',msg:''};
try{var _sc=JSON.parse(localStorage.getItem(SKEY)||'null');if(_sc&&_sc.url){sync.url=_sc.url;sync.at=_sc.at||0;sync.state='idle';}}catch(e){}
function syncOn(){return !!sync.url}
function saveSyncCfg(){try{localStorage.setItem(SKEY,JSON.stringify({url:sync.url,at:sync.at}))}catch(e){}}
function syncURL(extra){return sync.url+(sync.url.indexOf('?')<0?'?':'&')+extra}
function syncPull(cb){
  if(!syncOn()){if(cb)cb();return}
  sync.state='busy';flag();
  fetch(syncURL('_='+Date.now()),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(!j||j.error)throw new Error((j&&j.error)||'ตอบกลับผิดรูปแบบ');
    var changed=false;
    if(j.data&&j.data.v&&(+j.data.updatedAt||0)>(+S.updatedAt||0)){S=migrate(j.data);mirror();changed=true;}
    sync.state='ok';sync.at=Date.now();sync.msg='';saveSyncCfg();
    if(changed)render();else flag();
    if(cb)cb(null,changed);
  },function(e){sync.state='err';sync.msg=(e&&e.message)||'ดึงข้อมูลไม่สำเร็จ';flag();if(cb)cb(e)});
}
var pushT=null;
function syncPush(cb,tries){
  if(!syncOn()){if(cb)cb();return}
  sync.state='busy';flag();
  fetch(syncURL('_='+Date.now()),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(S),keepalive:true}).then(function(r){return r.json()}).then(function(j){
    if(!j||j.error)throw new Error((j&&j.error)||'บันทึกไม่สำเร็จ');
    sync.state='ok';sync.at=Date.now();sync.msg='';saveSyncCfg();flag();if(cb)cb(null);
  },function(e){
    var n=(tries||0)+1;
    if(n<=3){sync.state='busy';flag();setTimeout(function(){syncPush(cb,n)},n*4000);return}
    sync.state='err';sync.msg=(e&&e.message)||'ส่งข้อมูลไม่สำเร็จ';flag();if(cb)cb(e);
  });
}
function queuePush(){
  if(!syncOn())return;
  clearTimeout(pushT);pushT=setTimeout(function(){pushT=null;syncPush()},1200);
}
function flushPush(){ if(syncOn()&&pushT){clearTimeout(pushT);pushT=null;syncPush()} }
function busyUI(){
  if(document.querySelector('.scrim'))return true;
  var t=(document.activeElement||{}).tagName;
  return t==='INPUT'||t==='TEXTAREA'||t==='SELECT';
}
function autoPull(){ if(syncOn()&&!document.hidden&&!busyUI()&&sync.state!=='busy')syncPull(); }
function syncLabel(){
  if(!syncOn())return null;
  if(sync.state==='busy')return ['busy','กำลังซิงก์','กับ Google Drive'];
  if(sync.state==='err')return ['err','ซิงก์ไม่สำเร็จ',sync.msg||'ลองใหม่ในหน้าตั้งค่า'];
  return ['','ข้อมูลซิงก์แล้ว',sync.at?('ล่าสุด '+new Date(sync.at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})):'แก้ไขได้ทุกอุปกรณ์'];
}

function donut(items,center,sub,size){
  size=size||132;
  var tot=sum(items,function(i){return i.v}),R=size/2,r=R-11,C=2*Math.PI*r,off=0,segs='';
  if(tot<=0){
    segs='<circle cx="'+R+'" cy="'+R+'" r="'+r+'" fill="none" stroke="var(--card2)" stroke-width="15"/>';
  }else{
    items.forEach(function(it,i){
      var frac=(+it.v||0)/tot;if(frac<=0)return;
      var len=Math.max(0,frac*C-2.5);
      segs+='<circle cx="'+R+'" cy="'+R+'" r="'+r+'" fill="none" stroke="'+(it.c||SERIES[i%SERIES.length])+'" stroke-width="15" stroke-linecap="round"'+
        ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+R+' '+R+')"/>';
      off+=frac*C;
    });
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="สัดส่วน">'+segs+
    '<text x="'+R+'" y="'+(R-(sub?2:-5))+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="'+(size>120?17:15)+'" font-weight="600" fill="var(--ink)">'+esc(center)+'</text>'+
    (sub?'<text x="'+R+'" y="'+(R+15)+'" text-anchor="middle" font-family="Anuphan,sans-serif" font-size="11" fill="var(--faint)">'+esc(sub)+'</text>':'')+'</svg>';
}
function legend(items,fmt){
  var tot=sum(items,function(i){return i.v});
  return '<div class="dlegend">'+items.map(function(it,i){
    var pc=tot>0?(+it.v||0)/tot*100:0;
    return '<div class="l"><span class="sw" style="background:'+(it.c||SERIES[i%SERIES.length])+'"></span>'+
      '<span class="nm">'+esc(it.n)+'</span><span class="pc num">'+pc.toFixed(pc<10?1:0)+'%</span>'+
      '<span class="vv num">'+(fmt?fmt(it):m0(it.v))+'</span></div>';

}

function notices(){
  var out=[],t=today(),cur=mkey(t)===V.mk;
  if(!started()){
    out.push(note('','🗓️','จะเริ่มบันทึกวันที่ '+dLabel(startD()),'ก่อนถึงวันนั้นระบบยังไม่นับรายรับ–รายจ่าย และไม่สรุปยอดย้อนหลัง','tab:set','เปลี่ยนวันเริ่ม'));
    return out.join('');
  }
  var d=dailyBudget(mkey(t)),used=spentOn(t),pc=d.v>0?used/d.v*100:0;
  if(cur&&mkey(t)===V.mk){}
  if(d.v>0&&pc>100)
    out.push(note('crit','🚨','วันนี้ใช้เกินงบรายวันแล้ว '+m0(used-d.v),'งบวันละ '+m0(d.v)+' · ใช้ไป '+m0(used)+' ถ้าใช้เท่านี้ทั้งเดือนจะเกินงบ '+m0((used-d.v)*d.days),'tab:tx','ดูรายการ'));
  else if(d.v>0&&pc>=80)
    out.push(note('warn','🔔','ใกล้ครบงบของวันนี้แล้ว ('+Math.round(pc)+'%)','เหลืออีก '+m0(d.v-used)+' จากงบวันละ '+m0(d.v),'tab:tx','ดูรายการ'));
  if(!S.tx.some(function(x){return x.date===t}))
    out.push(note('','📝','ยังไม่ได้บันทึกรายการของวันนี้','ใส่รายจ่ายวันนี้ก่อนลืม','addtx','บันทึก'));
  var st=priceStale();
  if(S.holdings.length&&st>=1)
    out.push(note('warn','📈','ราคาหุ้น'+(st>900?'ยังไม่เคยอัปเดต':'อัปเดตล่าสุด '+st+' วันก่อน'),'อัปเดตราคาปิดเพื่อให้มูลค่าพอร์ตแม่นยำ','prices','อัปเดตราคา'));
  if(cur){
    var over=[],near=[],tx=txOf(V.mk);
    S.cats.expense.forEach(function(c){
      if(!(+c.b>0))return;
      var used=sum(tx.filter(function(x){return x.type==='expense'&&x.cat===c.id}),function(x){return x.amount});
      if(used>c.b)over.push(c.n);else if(used>=c.b*0.8)near.push(c.n);
    });
    if(over.length)out.push(note('crit','⚠️','ใช้เกินงบแล้ว: '+over.join(', '),'ปรับงบหรือลดรายจ่ายหมวดนี้','tab:tx','ดูงบ'));
    else if(near.length)out.push(note('warn','🔔','ใกล้เต็มงบ (80%+): '+near.join(', '),'เหลืองบไม่มากแล้วเดือนนี้','tab:tx','ดูงบ'));
    var pl=plan();
    if(pl.free<0)out.push(note('crit','📉','แผนเดือนนี้ติดลบ '+m0(-pl.free),'ภาระและเป้าหมายรวมมากกว่าเงินเดือนสุทธิ','tab:set','แก้แผน'));
  }
  return out.join('');
}

  var cs=S.cats.expense.filter(function(c){return +c.b>0});

function sheet(title,body,onmount){

  document.body.appendChild(s);

  s.addEventListener('click',function(e){if(e.target===s||e.target.closest('[data-close]'))close()});

function csvEsc(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvTx(){
  var rows=[['วันที่','ประเภท','หมวด','จำนวนเงิน','บันทึกช่วยจำ']];
  S.tx.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(t){

  var seg=path.split('.');

    else if(a==='adddca')dcaSheet(null);

    else if(a==='normdca'){normalizeDca();commit()}

        function(){S.dca=S.dca.filter(function(x){return x.id!==id});normalizeDca();commit()})}
    else if(a==='addfix')fixSheet(null);
    else if(a==='editfix')fixSheet(S.profile.fixed.find(function(x){return x.id===id}));

    else if(a==='delcat'){var ty=b.dataset.t,cc=S.cats[ty].find(function(x){return x.id===id});
      var used=S.tx.filter(function(x){return x.cat===id}).length;
      confirmSheet('ลบหมวด','ลบหมวด “'+esc(cc.n)+'”'+(used?' — มี '+used+' รายการที่ใช้หมวดนี้ รายการจะยังอยู่แต่แสดงว่าไม่ระบุหมวด':'')+' ใช่หรือไม่',
        function(){S.cats[ty]=S.cats[ty].filter(function(x){return x.id!==id});commit()})}
    else if(a==='csvtx')textSheet('CSV รายรับ–รายจ่าย',csvTx(),'transactions.csv');
    else if(a==='csvport')textSheet('CSV พอร์ตหุ้น',csvPort(),'portfolio.csv');
    else if(a==='backup')textSheet('ข้อมูลสำรอง',JSON.stringify(S),'mymoney-backup.json');
    else if(a==='restore')restoreSheet();
    else if(a==='syncsave'){
      var u=(document.getElementById('syncurl')||{}).value||'';
      u=u.trim();
      if(u&&!/^https:\/\//.test(u)){alert('ลิงก์ต้องขึ้นต้นด้วย https://');return}
      sync.url=u;sync.at=0;sync.state=u?'idle':'off';sync.msg='';saveSyncCfg();
      if(u)syncPull(function(err){if(!err)syncPush(function(){render()});else render()});
      else render();
    }
    else if(a==='syncpull')syncPull();
    else if(a==='syncpush')syncPush();
    else if(a==='syncoff'){sync.url='';sync.at=0;sync.state='off';saveSyncCfg();render()}
    return;
  }
  var vw=e.target.closest('[data-view]');
  if(vw){S.settings.view=vw.dataset.view;applyView();touch();render();window.scrollTo(0,0);return}
  var f=e.target.closest('[data-f]');
  if(f){V.filter=f.dataset.f;render()}
});
document.addEventListener('change',function(e){
  var i=e.target;
  if(i.dataset&&i.dataset.start){
    S.settings.startDate=i.value||'2026-09-01';
    if(V.mk<startMk())V.mk=startMk();
    commit();return;
  }
  if(i.dataset&&i.dataset.path){setPath(i.dataset.path,+i.value||0);touch();softRefresh();}
  else if(i.dataset&&i.dataset.k==='fixed'){
    var f=S.profile.fixed.find(function(x){return x.id===i.dataset.id});
    if(f){f.v=+i.value||0;touch();softRefresh();}
  }
});
function softRefresh(){
  // update the summary lines in the settings page without losing focus
  var leads=document.querySelectorAll('.setsec .lead p');
  if(!leads.length)return;
  var pl=plan();
  leads.forEach(function(p){
    if(/ภาระที่ต้องจ่ายทุกเดือน/.test(p.textContent))p.textContent='ภาระที่ต้องจ่ายทุกเดือน รวม '+m0(pl.fixed);
    if(/เงินที่ตั้งใจแยกเก็บ/.test(p.textContent))p.textContent='เงินที่ตั้งใจแยกเก็บและลงทุน รวม '+m0(pl.save);
  });
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){var s=document.querySelector('.scrim');if(s)s.remove()}
});
applyView();
render();
if(syncOn())setTimeout(function(){syncPull()},400);
document.addEventListener('visibilitychange',function(){
  if(document.hidden)flushPush();else setTimeout(autoPull,300);
});
window.addEventListener('pagehide',flushPush);
window.addEventListener('online',function(){flushPush();setTimeout(autoPull,800)});
setInterval(autoPull,60000);
/* เวอร์ชันที่โฮสต์เอง: ดึงราคาตลาดให้เองวันละครั้ง */
if(HOSTED&&S.settings.autoPrice&&S.holdings.length&&S.settings.lastAuto!==today()&&typeof fetch==='function'){
  setTimeout(function(){
    autoPrices().then(function(res){if(res.some(function(r){return r.ok})){touch();render();}});
  },1500);
}
})();
</script>

<script>
/* ติดตั้งแอป + ทำงานออฟไลน์ (เฉพาะเวอร์ชันที่โฮสต์เอง) */
(function(){
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;showBtn()});
  function showBtn(){
    var b=document.getElementById('installbtn');if(!b||!deferred)return;
    b.hidden=false;
    b.onclick=function(){deferred.prompt();deferred.userChoice.then(function(){deferred=null;b.hidden=true})};
  }
  new MutationObserver(showBtn).observe(document.body,{childList:true,subtree:true});
  window.addEventListener('appinstalled',function(){
    var b=document.getElementById('installbtn');if(b)b.hidden=true;
  });
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
})();
</script>
</body>
</html>
